name: HarmonyOS HAP Build

on:
  push:
    branches: [harmonyos]
  workflow_dispatch:

concurrency:
  group: harmonyos-hap-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-hap:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      PUB_HOSTED_URL: https://pub.flutter-io.cn
      FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn
      FLUTTER_GIT_URL: https://gitcode.com/CPF-Flutter/flutter_flutter.git
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up HarmonyOS command line tools
        uses: ErBWs/setup-ohos@v1
        with:
          version: latest
          cache: true
      - name: Set up Flutter for OpenHarmony 3.41.9
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch oh-3.41.9-dev https://gitcode.com/CPF-Flutter/flutter_flutter.git "$GITHUB_WORKSPACE/flutter-ohos"
          git -C "$GITHUB_WORKSPACE/flutter-ohos" tag --force 3.41.9 HEAD
          echo "$GITHUB_WORKSPACE/flutter-ohos/bin" >> "$GITHUB_PATH"
      - name: Configure HarmonyOS npm registry
        run: |
          cat > "$HOME/.npmrc" <<'EOF'
          registry=https://repo.huaweicloud.com/repository/npm/
          @ohos:registry=https://repo.harmonyos.com/npm/
          strict-ssl=true
          EOF
      - name: Verify toolchain
        run: |
          flutter --version
          test -d "$HOS_SDK_HOME"
      - name: Generate OHOS project scaffold
        run: flutter create --platforms ohos --org io.flycode .
      - name: Target HarmonyOS 6.1.1 API 24
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('ohos/build-profile.json5')
          s=p.read_text()
          for k in ('compileSdkVersion','compatibleSdkVersion','targetSdkVersion'):
              pat=rf'(["\']?{k}["\']?\s*:\s*)(["\']?[^,\n}}]+["\']?)'
              if re.search(pat,s): s=re.sub(pat,rf'\1"6.1.1(24)"',s,count=1)
              else:
                  m=re.search(r'(["\']?name["\']?\s*:\s*["\']default["\']\s*,)',s)
                  s=s[:m.end()]+f'\n        "{k}": "6.1.1(24)",'+s[m.end():]
          p.write_text(s)
          print(s)
          PY
      - name: Resolve Dart dependencies
        run: flutter pub get
      - name: Inspect Flutter OHOS Autofill integration
        shell: bash
        run: |
          set -euxo pipefail
          cd ohos
          ohpm install
          HELPER=$(find oh_modules -path '*flutter_ohos*/src/main/ets/plugin/editing/OhosAutoFillHelper.ets' -print -quit)
          test -n "$HELPER"
          echo "HELPER=$HELPER"
          echo '===== OhosAutoFillHelper.ets ====='
          sed -n '1,680p' "$HELPER"
          echo '===== references ====='
          grep -R -n -E 'OhosAutoFillHelper|ohosAutoFillHelper|autoFillHelper' "$(dirname "$HELPER")"/../.. | head -200 || true
      - name: Build ARM64 release HAP
        run: flutter build hap --release --target-platform ohos-arm64
      - name: Locate HAP
        if: always()
        run: find ohos -type f \( -name '*.hap' -o -name '*.app' \) -print 2>/dev/null || true
      - name: Upload HAP artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: flycode-harmonyos-arm64
          path: ohos/entry/build/default/outputs/**/*.hap
          if-no-files-found: error
          retention-days: 30
