name: HarmonyOS HAP Build

on:
  push:
    branches:
      - harmonyos
  workflow_dispatch:

concurrency:
  group: harmonyos-hap-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-hap:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    env:
      PUB_HOSTED_URL: https://pub.flutter-io.cn
      FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn
      FLUTTER_GIT_URL: https://gitcode.com/CPF-Flutter/flutter_flutter.git

    steps:
      - name: Checkout FlyCode
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up HarmonyOS command line tools
        uses: ErBWs/setup-ohos@v1
        with:
          version: latest
          cache: true

      - name: Set up Flutter for OpenHarmony 3.41.9
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch oh-3.41.9-dev https://gitcode.com/CPF-Flutter/flutter_flutter.git "$GITHUB_WORKSPACE/flutter-ohos"
          git -C "$GITHUB_WORKSPACE/flutter-ohos" tag --force 3.41.9 HEAD
          echo "$GITHUB_WORKSPACE/flutter-ohos/bin" >> "$GITHUB_PATH"

      - name: Configure HarmonyOS npm registry
        shell: bash
        run: |
          cat > "$HOME/.npmrc" <<'EOF'
          registry=https://repo.huaweicloud.com/repository/npm/
          @ohos:registry=https://repo.harmonyos.com/npm/
          strict-ssl=true
          EOF

      - name: Verify HarmonyOS Flutter toolchain
        shell: bash
        run: |
          set -euxo pipefail
          flutter --version
          test -d "$HOS_SDK_HOME"

      - name: Generate OHOS project scaffold
        shell: bash
        run: |
          set -euxo pipefail
          flutter create --platforms ohos --org io.flycode .

      - name: Resolve Dart dependencies
        shell: bash
        run: |
          set -euxo pipefail
          flutter pub get

      - name: Build ARM64 release HAP
        shell: bash
        run: |
          set -euxo pipefail
          flutter build hap --release --target-platform ohos-arm64

      - name: Locate HAP
        if: always()
        shell: bash
        run: |
          find ohos -type f \( -name '*.hap' -o -name '*.app' \) -print 2>/dev/null || true

      - name: Upload HAP artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: flycode-harmonyos-arm64
          path: |
            ohos/entry/build/default/outputs/default/*.hap
            ohos/entry/build/default/outputs/**/*.hap
          if-no-files-found: error
          retention-days: 30
