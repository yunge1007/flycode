name: HarmonyOS HAP Build

on:
  push:
    branches: [harmonyos]
  workflow_dispatch:

concurrency:
  group: harmonyos-hap-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-hap:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      PUB_HOSTED_URL: https://pub.flutter-io.cn
      FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn
      FLUTTER_GIT_URL: https://gitcode.com/CPF-Flutter/flutter_flutter.git

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up HarmonyOS command line tools
        uses: ErBWs/setup-ohos@v1
        with:
          version: latest
          cache: true

      - name: Set up Flutter for OpenHarmony 3.41.9
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch oh-3.41.9-dev https://gitcode.com/CPF-Flutter/flutter_flutter.git "$GITHUB_WORKSPACE/flutter-ohos"
          git -C "$GITHUB_WORKSPACE/flutter-ohos" tag --force 3.41.9 HEAD
          echo "$GITHUB_WORKSPACE/flutter-ohos/bin" >> "$GITHUB_PATH"

      - name: Configure HarmonyOS npm registry
        run: |
          cat > "$HOME/.npmrc" <<'EOF'
          registry=https://repo.huaweicloud.com/repository/npm/
          @ohos:registry=https://repo.harmonyos.com/npm/
          strict-ssl=true
          EOF

      - name: Verify toolchain
        run: |
          flutter --version
          test -d "$HOS_SDK_HOME"

      - name: Generate OHOS project scaffold
        run: flutter create --platforms ohos --org io.flycode .

      - name: Embed verified PNG launcher icon and configure permissions
        shell: bash
        run: |
          set -euxo pipefail
          test -f assets/app_icon/harmony_icon.svg
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends librsvg2-bin
          rsvg-convert -w 512 -h 512 assets/app_icon/harmony_icon.svg -o /tmp/flycode_app_icon.png
          file /tmp/flycode_app_icon.png
          test -s /tmp/flycode_app_icon.png
          cp /tmp/flycode_app_icon.png ohos/AppScope/resources/base/media/app_icon.png
          cp /tmp/flycode_app_icon.png ohos/entry/src/main/resources/base/media/icon.png

          python3 - <<'PY'
          from pathlib import Path
          import re
          app = Path('ohos/AppScope/app.json5')
          s = app.read_text()
          s = re.sub(r'(["\']?icon["\']?\s*:\s*)["\'][^"\']+["\']', r'\1"$media:app_icon"', s, count=1)
          app.write_text(s)
          module = Path('ohos/entry/src/main/module.json5')
          s = module.read_text()
          s = re.sub(r'(["\']?icon["\']?\s*:\s*)["\'][^"\']+["\']', r'\1"$media:icon"', s, count=1)
          s = re.sub(r'(["\']?startWindowIcon["\']?\s*:\s*)["\'][^"\']+["\']', r'\1"$media:icon"', s, count=1)
          if 'ohos.permission.INTERNET' not in s:
              m = re.search(r'(["\']?requestPermissions["\']?\s*:\s*\[)(.*?)(\])', s, re.S)
              perm = '{ "name": "ohos.permission.INTERNET" }'
              if m:
                  body = m.group(2).rstrip()
                  if body and not body.rstrip().endswith(','):
                      body += ','
                  body += '\n      ' + perm + '\n    '
                  s = s[:m.start()] + m.group(1) + body + m.group(3) + s[m.end():]
              else:
                  outer_close = s.rfind('}')
                  module_close = s.rfind('}', 0, outer_close)
                  if module_close < 0:
                      raise RuntimeError('Cannot locate module object')
                  prefix = s[:module_close].rstrip()
                  if not prefix.endswith(','):
                      prefix += ','
                  s = prefix + '\n    "requestPermissions": [\n      ' + perm + '\n    ]\n  ' + s[module_close:]
          module.write_text(s)
          print(app.read_text())
          print(module.read_text())
          PY

      - name: Target HarmonyOS 6.1.1 API 24
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('ohos/build-profile.json5')
          s = p.read_text()
          for key in ('compileSdkVersion', 'compatibleSdkVersion', 'targetSdkVersion'):
              pattern = rf'(["\']?{key}["\']?\s*:\s*)(["\']?[^,\n}}]+["\']?)'
              if re.search(pattern, s):
                  s = re.sub(pattern, rf'\1"6.1.1(24)"', s, count=1)
              else:
                  marker = re.search(r'(["\']?name["\']?\s*:\s*["\']default["\']\s*,)', s)
                  if marker is None:
                      raise RuntimeError(f'Cannot add {key}: default product not found')
                  s = s[:marker.end()] + f'\n        "{key}": "6.1.1(24)",' + s[marker.end():]
          p.write_text(s)
          print(s)
          PY

      - name: Resolve Dart dependencies
        run: flutter pub get

      - name: Patch HarmonyOS and OpenCode message compatibility
        run: python3 tool/ohos_compat_patch.py

      - name: Precache OHOS release engine
        shell: bash
        run: |
          set -euxo pipefail
          flutter precache --ohos
          HAR="$GITHUB_WORKSPACE/flutter-ohos/bin/cache/artifacts/engine/ohos-arm64-release/flutter_embedding_release.har"
          test -f "$HAR"
          echo "FLUTTER_OHOS_EMBEDDING_HAR=$HAR" >> "$GITHUB_ENV"
          ls -lh "$HAR"

      - name: Patch Flutter OHOS Autofill compatibility
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import io
          import os
          import tarfile
          from pathlib import Path
          har = Path(os.environ['FLUTTER_OHOS_EMBEDDING_HAR'])
          target = 'package/src/main/ets/plugin/editing/OhosAutoFillHelper.ets'
          members = []
          patched = False
          with tarfile.open(har, 'r:gz') as src:
              for member in src.getmembers():
                  f = src.extractfile(member) if member.isfile() else None
                  data = f.read() if f else b''
                  if member.name == target:
                      text = data.decode('utf-8')
                      before = text
                      type_map = {'autoFillManager.AutoFillType': 'number', 'autoFillManager.ViewData': 'OhosViewData', 'autoFillManager.AutoFillTriggerType': 'number', 'autoFillManager.FillRequest': 'ESObject', 'autoFillManager.AutoFillCallback': 'ESObject', 'autoFillManager.FillFailureResult': 'ESObject', 'autoFillManager.SaveRequest': 'ESObject'}
                      for old, new in type_map.items():
                          text = text.replace(old, new)
                      text = text.replace('autoFillManager.requestAutoFill(', '(autoFillManager as ESObject).requestAutoFill(')
                      text = text.replace('autoFillManager.requestAutoSave(', '(autoFillManager as ESObject).requestAutoSave(')
                      if text == before:
                          raise RuntimeError('Autofill helper found but no compatibility edits were applied')
                      data = text.encode('utf-8')
                      member.size = len(data)
                      patched = True
                  members.append((member, data))
          if not patched:
              raise RuntimeError(f'{target} not found in {har}')
          tmp = har.with_suffix(har.suffix + '.tmp')
          with tarfile.open(tmp, 'w:gz') as dst:
              for member, data in members:
                  if member.isfile():
                      dst.addfile(member, io.BytesIO(data))
                  else:
                      dst.addfile(member)
          tmp.replace(har)
          print('Autofill HAR patch verified')
          PY

      - name: Build unsigned ARM64 release HAP
        run: flutter build hap --release --no-codesign --target-platform ohos-arm64

      - name: Verify packaged HAP metadata and icons
        shell: bash
        run: |
          set -euxo pipefail
          HAP="ohos/entry/build/default/outputs/default/entry-default-unsigned.hap"
          test -f "$HAP"
          python3 - <<'PY'
          import hashlib
          import json
          import zipfile
          from pathlib import Path
          hap = Path('ohos/entry/build/default/outputs/default/entry-default-unsigned.hap')
          expected_icon = Path('/tmp/flycode_app_icon.png').read_bytes()
          expected_hash = hashlib.sha256(expected_icon).hexdigest()
          with zipfile.ZipFile(hap) as z:
              module = json.loads(z.read('module.json'))
              names = set(z.namelist())
              assert module['app']['versionCode'] == 6, module['app']
              assert module['app']['icon'] == '$media:app_icon', module['app']
              ability = module['module']['abilities'][0]
              assert ability['icon'] == '$media:icon', ability
              assert ability['startWindowIcon'] == '$media:icon', ability
              assert 'resources/base/media/app_icon.png' in names
              assert 'resources/base/media/icon.png' in names
              assert hashlib.sha256(z.read('resources/base/media/app_icon.png')).hexdigest() == expected_hash
              assert hashlib.sha256(z.read('resources/base/media/icon.png')).hexdigest() == expected_hash
              print(json.dumps(module, ensure_ascii=False, indent=2))
              print('Verified packaged launcher icon SHA256:', expected_hash)
          PY

      - name: Prepare HAP artifact
        shell: bash
        run: |
          set -euxo pipefail
          HAP="ohos/entry/build/default/outputs/default/entry-default-unsigned.hap"
          mkdir -p dist
          cp "$HAP" dist/FlyCode-HarmonyOS-v1.1.0-build6-compat-arm64-unsigned.hap
          sha256sum dist/FlyCode-HarmonyOS-v1.1.0-build6-compat-arm64-unsigned.hap
          ls -lh dist/FlyCode-HarmonyOS-v1.1.0-build6-compat-arm64-unsigned.hap

      - name: Upload HAP artifact
        uses: actions/upload-artifact@v4
        with:
          name: flycode-harmonyos-build6-compat
          path: dist/FlyCode-HarmonyOS-v1.1.0-build6-compat-arm64-unsigned.hap
          if-no-files-found: error
          retention-days: 30
