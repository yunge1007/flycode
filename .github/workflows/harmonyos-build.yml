name: HarmonyOS HAP Build

on:
  push:
    branches: [harmonyos]
  workflow_dispatch:

concurrency:
  group: harmonyos-hap-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-hap:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      PUB_HOSTED_URL: https://pub.flutter-io.cn
      FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn
      FLUTTER_GIT_URL: https://gitcode.com/CPF-Flutter/flutter_flutter.git
      HARMONY_APP_P12_BASE64: ${{ secrets.HARMONY_APP_P12_BASE64 }}
      HARMONY_APP_CERT_BASE64: ${{ secrets.HARMONY_APP_CERT_BASE64 }}
      HARMONY_PROFILE_P7B_BASE64: ${{ secrets.HARMONY_PROFILE_P7B_BASE64 }}
      HARMONY_KEY_ALIAS: ${{ secrets.HARMONY_KEY_ALIAS }}
      HARMONY_KEY_PASSWORD: ${{ secrets.HARMONY_KEY_PASSWORD }}
      HARMONY_STORE_PASSWORD: ${{ secrets.HARMONY_STORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up HarmonyOS command line tools
        uses: ErBWs/setup-ohos@v1
        with:
          version: latest
          cache: true

      - name: Set up Flutter for OpenHarmony 3.41.9
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch oh-3.41.9-dev https://gitcode.com/CPF-Flutter/flutter_flutter.git "$GITHUB_WORKSPACE/flutter-ohos"
          git -C "$GITHUB_WORKSPACE/flutter-ohos" tag --force 3.41.9 HEAD
          echo "$GITHUB_WORKSPACE/flutter-ohos/bin" >> "$GITHUB_PATH"

      - name: Configure HarmonyOS npm registry
        run: |
          cat > "$HOME/.npmrc" <<'EOF'
          registry=https://repo.huaweicloud.com/repository/npm/
          @ohos:registry=https://repo.harmonyos.com/npm/
          strict-ssl=true
          EOF

      - name: Verify toolchain
        run: |
          flutter --version
          test -d "$HOS_SDK_HOME"

      - name: Generate OHOS project scaffold
        run: flutter create --platforms ohos --org io.flycode .

      - name: Target HarmonyOS 6.1.1 API 24
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('ohos/build-profile.json5')
          s = p.read_text()
          for key in ('compileSdkVersion', 'compatibleSdkVersion', 'targetSdkVersion'):
              pattern = rf'(["\']?{key}["\']?\s*:\s*)(["\']?[^,\n}}]+["\']?)'
              if re.search(pattern, s):
                  s = re.sub(pattern, rf'\1"6.1.1(24)"', s, count=1)
              else:
                  marker = re.search(r'(["\']?name["\']?\s*:\s*["\']default["\']\s*,)', s)
                  if marker is None:
                      raise RuntimeError(f'Cannot add {key}: default product not found')
                  s = s[:marker.end()] + f'\n        "{key}": "6.1.1(24)",' + s[marker.end():]
          p.write_text(s)
          print(s)
          PY

      - name: Resolve Dart dependencies
        run: flutter pub get

      - name: Precache OHOS release engine
        shell: bash
        run: |
          set -euxo pipefail
          flutter precache --ohos
          HAR="$GITHUB_WORKSPACE/flutter-ohos/bin/cache/artifacts/engine/ohos-arm64-release/flutter_embedding_release.har"
          test -f "$HAR"
          echo "FLUTTER_OHOS_EMBEDDING_HAR=$HAR" >> "$GITHUB_ENV"
          ls -lh "$HAR"

      - name: Patch Flutter OHOS Autofill compatibility
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import io
          import os
          import tarfile
          from pathlib import Path

          har = Path(os.environ['FLUTTER_OHOS_EMBEDDING_HAR'])
          target = 'package/src/main/ets/plugin/editing/OhosAutoFillHelper.ets'
          members = []
          patched = False

          with tarfile.open(har, 'r:gz') as src:
              for member in src.getmembers():
                  f = src.extractfile(member) if member.isfile() else None
                  data = f.read() if f else b''
                  if member.name == target:
                      text = data.decode('utf-8')
                      before = text
                      type_map = {
                          'autoFillManager.AutoFillType': 'number',
                          'autoFillManager.ViewData': 'OhosViewData',
                          'autoFillManager.AutoFillTriggerType': 'number',
                          'autoFillManager.FillRequest': 'ESObject',
                          'autoFillManager.AutoFillCallback': 'ESObject',
                          'autoFillManager.FillFailureResult': 'ESObject',
                          'autoFillManager.SaveRequest': 'ESObject',
                      }
                      for old, new in type_map.items():
                          text = text.replace(old, new)
                      text = text.replace(
                          'autoFillManager.requestAutoFill(',
                          '(autoFillManager as ESObject).requestAutoFill(',
                      )
                      text = text.replace(
                          'autoFillManager.requestAutoSave(',
                          '(autoFillManager as ESObject).requestAutoSave(',
                      )
                      if text == before:
                          raise RuntimeError('Autofill helper found but no compatibility edits were applied')
                      data = text.encode('utf-8')
                      member.size = len(data)
                      patched = True
                      print('Patched', target)
                  members.append((member, data))

          if not patched:
              raise RuntimeError(f'{target} not found in {har}')

          tmp = har.with_suffix(har.suffix + '.tmp')
          with tarfile.open(tmp, 'w:gz') as dst:
              for member, data in members:
                  if member.isfile():
                      dst.addfile(member, io.BytesIO(data))
                  else:
                      dst.addfile(member)
          tmp.replace(har)

          with tarfile.open(har, 'r:gz') as check:
              text = check.extractfile(target).read().decode('utf-8')
              assert 'autoFillManager.AutoFillType' not in text
              assert '(autoFillManager as ESObject).requestAutoFill(' in text
              print('Autofill HAR patch verified')
          PY

      - name: Build unsigned ARM64 release HAP
        run: flutter build hap --release --no-codesign --target-platform ohos-arm64

      - name: Prepare unsigned HAP artifact
        shell: bash
        run: |
          set -euxo pipefail
          HAP="ohos/entry/build/default/outputs/default/entry-default-unsigned.hap"
          test -f "$HAP"
          mkdir -p dist
          cp "$HAP" dist/flycode-harmonyos-arm64-unsigned.hap
          ls -lh dist/flycode-harmonyos-arm64-unsigned.hap

      - name: Sign HAP for HarmonyOS device
        if: ${{ env.HARMONY_APP_P12_BASE64 != '' && env.HARMONY_APP_CERT_BASE64 != '' && env.HARMONY_PROFILE_P7B_BASE64 != '' && env.HARMONY_KEY_ALIAS != '' && env.HARMONY_KEY_PASSWORD != '' && env.HARMONY_STORE_PASSWORD != '' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/harmony-signing"
          printf '%s' "$HARMONY_APP_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/harmony-signing/app.p12"
          printf '%s' "$HARMONY_APP_CERT_BASE64" | base64 --decode > "$RUNNER_TEMP/harmony-signing/app.cer"
          printf '%s' "$HARMONY_PROFILE_P7B_BASE64" | base64 --decode > "$RUNNER_TEMP/harmony-signing/app.p7b"

          SIGN_TOOL=$(find "$HOS_SDK_HOME" -type f -name 'hap-sign-tool.jar' -print -quit)
          test -n "$SIGN_TOOL"

          java -jar "$SIGN_TOOL" sign-app \
            -mode localSign \
            -keyAlias "$HARMONY_KEY_ALIAS" \
            -keyPwd "$HARMONY_KEY_PASSWORD" \
            -appCertFile "$RUNNER_TEMP/harmony-signing/app.cer" \
            -profileFile "$RUNNER_TEMP/harmony-signing/app.p7b" \
            -inFile dist/flycode-harmonyos-arm64-unsigned.hap \
            -signAlg SHA256withECDSA \
            -keystoreFile "$RUNNER_TEMP/harmony-signing/app.p12" \
            -keystorePwd "$HARMONY_STORE_PASSWORD" \
            -outFile dist/flycode-harmonyos-arm64-signed.hap \
            -compatibleVersion 24 \
            -signCode 1

          test -f dist/flycode-harmonyos-arm64-signed.hap
          ls -lh dist/flycode-harmonyos-arm64-signed.hap

      - name: Locate HAP
        if: always()
        run: find ohos dist -type f \( -name '*.hap' -o -name '*.app' \) -print 2>/dev/null || true

      - name: Upload unsigned HAP artifact
        uses: actions/upload-artifact@v4
        with:
          name: flycode-harmonyos-arm64-unsigned
          path: dist/flycode-harmonyos-arm64-unsigned.hap
          if-no-files-found: error
          retention-days: 30

      - name: Upload signed HAP artifact
        if: ${{ env.HARMONY_APP_P12_BASE64 != '' && env.HARMONY_APP_CERT_BASE64 != '' && env.HARMONY_PROFILE_P7B_BASE64 != '' && env.HARMONY_KEY_ALIAS != '' && env.HARMONY_KEY_PASSWORD != '' && env.HARMONY_STORE_PASSWORD != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: flycode-harmonyos-arm64-signed
          path: dist/flycode-harmonyos-arm64-signed.hap
          if-no-files-found: error
          retention-days: 30
