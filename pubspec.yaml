name: flycode
description: "A new Flutter project."
publish_to: 'none'

version: 1.1.0+3

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  json_annotation: ^4.11.0
  flutter_riverpod: ^3.2.1
  riverpod: ^3.2.1
  riverpod_annotation: ^4.0.2
  go_router: ^17.1.0
  http: ^1.6.0
  # HarmonyOS/OpenHarmony-compatible fork. The pub.dev package does not
  # register an OHOS implementation, which leaves startup waiting forever on
  # SharedPreferences.getInstance().
  shared_preferences:
    git:
      url: https://gitcode.com/CPF-Flutter/flutter_packages.git
      ref: br_shared_preferences-v2.3.2_ohos
      path: packages/shared_preferences/shared_preferences
  sqflite: ^2.4.2
  path: ^1.9.0
  flutter_markdown_plus: ^1.0.7
  markdown: ^7.3.0
  image_picker: ^1.1.2
  mime: ^2.0.0
  clipboard: ^3.0.14
  diff_match_patch: ^0.4.1
  shimmer: ^3.0.0
  url_launcher: ^6.3.1
  flutter_local_notifications: ^17.2.4
  flutter_highlight: ^0.7.0
  highlight: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.11.1
  json_serializable: ^6.13.0
  riverpod_generator: ^4.0.3
  flutter_launcher_icons: ^0.14.4

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/fonts/OFL.txt
    - assets/app_icon/app_logo.jpg
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-VariableFont_opsz,wght.ttf
        - asset: assets/fonts/Inter-Italic-VariableFont_opsz,wght.ttf
          style: italic
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-VariableFont_wght.ttf
        - asset: assets/fonts/PlusJakartaSans-Italic-VariableFont_wght.ttf
          style: italic

flutter_launcher_icons:
  image_path: assets/app_icon/app_logo.jpg
  android: true
  ios: true
  web:
    generate: true
    image_path: assets/app_icon/app_logo.jpg
    background_color: '#000000'
    theme_color: '#000000'
  windows:
    generate: true
    image_path: assets/app_icon/app_logo.jpg
    icon_size: 48
  macos:
    generate: true
    image_path: assets/app_icon/app_logo.jpg
